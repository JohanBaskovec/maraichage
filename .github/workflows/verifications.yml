name: Vérifications

on:
  push:
  pull_request:

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verifications:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Tests unitaires et d'intégration (D1 locale)
        run: npm test

      - name: Schéma et migrations synchronisés
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts a changé sans migration : lancer « npm run db:generate » et committer drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (Playwright)
        run: npm run test:e2e

      - name: Rapport des tests de bout en bout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
